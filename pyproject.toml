[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# only the package itself; the repository data/ folder is not installed
# (generation.data.Data downloads data files on demand)
include = ["generation*"]

[tool.setuptools.package-data]
# list every file pattern the package reads at run time
generation = ["*.py"]

[tool.setuptools.dynamic]
dependencies = {file=["requirements.txt"]}

[project]
name = "generation"
version = "0.0.0" # 0.0.0 = unreleased (hidden by `epm index`)
description = "Generation fleet data accessor"
authors = [
    {name = "David P. Chassin <dchassin@eudoxys.com>"},
    ]
maintainers = [
    {name = "David P. Chassin <dchassin@eudoxys.com>"},
    ]
readme = "README.md"
requires-python = "== 3.12.*" # must match the CI python version
keywords = ["eudoxys","python","US","electricity","generation","model"]
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    ]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/eudoxys/generation"
Documentation = "https://www.eudoxys.com/generation"
Repository = "https://github.com/eudoxys/generation.git"
Issues = "https://github.com/eudoxys/generation/issues"

[project.scripts]
generation = "generation.cli:main"

[tool.pytest.ini_options]
testpaths = ["generation/_test"]
markers = [
    "network: downloads external data (slow on an empty cache)",
    ]
