[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
generation = ["*.py"]

[tool.setuptools.dynamic]
dependencies = {file=["requirements.txt"]}

[project]
name = "generation"
version = "0.0.0"
description = "Generation fleet data accessor"
authors = [
    {name = "David P. Chassin <dchassin@eudoxys.com>"},
    ]
maintainers = [
    {name = "David P. Chassin <dchassin@eudoxys.com>"},
    ]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["github","python","US","electricity","generation","model"]
license = {text="MIT License"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    ]
dynamic=["dependencies"]

[project.urls]
Homepage = "https://github.com/eudoxys/generation"
Documentation = "https://www.eudoxys.com/generation"
Repository = "https://github.com/eudoxys/generation.git"
Issues = "https://github.com/eudoxys/generation/issues"

[project.scripts]
generation = "generation.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
